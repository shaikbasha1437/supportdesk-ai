<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SupportDesk AI · customer support agent in your browser</title>
<meta name="description" content="A customer support agent that reads your docs, answers tickets with citations and escalates to a human. Runs in your browser: demo mode with local retrieval, or bring your own AI key.">

<meta name="theme-color" content="#0f1222" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">

<body>
<a class="skip" href="#view">Skip to content</a>
<header class="top">
  <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>SupportDesk <b>AI</b></span></div>
  <nav class="tabs" aria-label="Sections">
    <a href="#inbox" data-tab="inbox">Inbox</a>

    <a href="#widget" data-tab="widget">Chat widget</a>
    <a href="#settings" data-tab="settings">Settings</a>
  </nav>
  <div class="top-actions">
    <button type="button" class="mode-chip" id="mode-chip" title="Change how replies are written">Demo mode</button>
    <button type="button" class="icon-btn" id="theme-btn" aria-label="Switch light or dark theme" title="Theme">◐</button>
    <button type="button" class="icon-btn" id="about-btn" aria-label="About SupportDesk AI" title="About">?</button>
