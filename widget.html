<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help chat · SupportDesk AI</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
:root { --c: #4f46e5; --bg: #fff; --ink: #161a2e; --muted: #5b6178; --line: #e2e5ef; --me: #eef0ff; --bot: #f3f4f8; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #171b30; --ink: #e8eaf6; --muted: #a0a6c3; --line: #2b3154; --me: #2a2f5c; --bot: #1f2440; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
header { background: var(--c); color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
header .t { flex: 1; } header b { display: block; font-size: 16px; } header span { font-size: 12.5px; opacity: .9; }
header button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.18); color: #fff; font-size: 20px; cursor: pointer; }
#log { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.m { max-width: 88%; padding: 9px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
.me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px; }
.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
.bot .src { margin-top: 6px; font-size: 12.5px; color: var(--muted); white-space: normal; }
.bot .src button { border: 0; background: none; color: var(--c); padding: 0; cursor: pointer; font: inherit; text-decoration: underline; }
.bot .note { margin-top: 6px; font-size: 12.5px; color: var(--muted); white-space: normal; }
.cite { color: var(--c); font-weight: 700; font-size: 12px; }
.typing { color: var(--muted); font-style: italic; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 8px; }
.chips button, .human { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
input { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font: inherit; background: var(--bg); color: var(--ink); min-width: 0; }
form button { border: 0; background: var(--c); color: #fff; border-radius: 10px; padding: 0 14px; font-weight: 700; cursor: pointer; font: inherit; }
:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
.foot { text-align: center; font-size: 11.5px; color: var(--muted); padding: 0 10px 8px; }
.foot a { color: inherit; }
</style>
</head>
<body>
<header><div class="t"><b id="w-title">Help</b><span>Answers from the help center · demo mode</span></div><button type="button" id="w-close" aria-label="Close chat" hidden>×</button></header>
<div id="log" role="log" aria-live="polite"></div>
<div class="chips" id="chips"></div>
<form id="w-form" autocomplete="off"><label for="w-in" style="position:absolute;left:-9999px">Message</label><input id="w-in" placeholder="Ask a question…" maxlength="2000"><button type="submit">Send</button></form>
<div class="foot">Demo mode: answers quote the help docs. Nothing you type leaves this page. <a href="./" target="_blank" rel="noopener">SupportDesk AI</a></div>
<script src="js/agentkit/text.js"></script>
<script src="js/agentkit/retrieval.js"></script>
<script src="js/agentkit/guard.js"></script>
<script src="js/agentkit/keystore.js"></script>
<script src="js/data/kb1.js"></script>
<script src="js/data/kb2.js"></script>
<script src="js/data/kb.js"></script>
<script src="js/support/classify.js"></script>
<script src="js/support/compose.js"></script>
<script src="js/support/rules.js"></script>
<script src="js/support/pipeline.js"></script>
<script src="js/widget.js"></script>
</body>
</html>
